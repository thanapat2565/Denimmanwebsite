<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | DenimMan</title>

    <link rel="stylesheet" href="adminstyle.css">
</head>

<body>

    <!-- ==========================================
         ADMIN LOGIN
    =========================================== -->

    <main class="admin-login-page">

        <div class="admin-login-container">

            <div class="admin-login-logo">
                <img src="images/logo.png" alt="DenimMan">
            </div>

            <p class="admin-login-label">
                DENIMMAN ADMIN
            </p>

            <h1>
                ADMIN LOGIN
            </h1>

            <p class="admin-login-description">
                Sign in to manage your DenimMan store.
            </p>


            <!-- Login Form -->

            <form id="admin-login-form">

                <div class="admin-form-group">

                    <label for="admin-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="admin-form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-login-button"
                >
                    LOGIN
                </button>

            </form>


            <!-- Error Message -->

            <p
                id="admin-login-error"
                class="admin-login-error"
            ></p>


            <a
                href="index.html"
                class="admin-back-link"
            >
                ← Back to DenimMan
            </a>

        </div>

    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script type="module" src="js/admin-login.js"></script>

</body>

</html>
